[workspace]
resolver = "2"
members = ["crates/overdrive-core", "crates/overdrive-win"]

[workspace.package]
version = "1.0.0-alpha.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
