# Overdrive optimization catalog (goals.md §5.3).
#
# Each entry is DATA: what it is, when it applies, how risky it is and how sure we are it
# helps. The exact system changes are produced by a builder in
# crates/overdrive-core/src/catalog.rs (one per id), which reads the current state first
# so it never overwrites more than it needs.
#
# scope:     session    = applied for the game session, reverted when the game closes
#            persistent = tested per session first; kept permanently only if it proves
#                         useful AND the user accepts
# timing:    before_launch = must be in place before the game starts (IFEO, GPU preference)
#            at_launch     = applied when the game process appears
# measure:   frametime        = judged by the 1 % low (A/B, see experiment.rs)
#            background_noise = judged by stutters per minute
#            none             = protective, never claims a performance gain
# evidence:  proven | version_dependent | disputed
# order:     experiment order — highest expected impact first

[[tweak]]
id = "hybrid_gpu"
scope = "persistent"
timing = "before_launch"
risk = "low"
evidence = "proven"
anticheat_safe = true
measure = "frametime"
requires_reboot = false
persistent_candidate = true
order = 10
notes = "Laptops with two GPUs: Windows per-app GPU preference (Settings > Display > Graphics). The single biggest real-world fix on low-end laptops."

